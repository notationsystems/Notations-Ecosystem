name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  control-plane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd control-plane && npm run check
      - name: Security invariants
        run: cd control-plane && npm test

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: No secret may be committed (SEC-004)
        run: node security/scan-secrets.mjs
      - name: Dependency audit (dock)
        run: cd dock && npm ci --ignore-scripts && npm audit --audit-level=high
      - name: Posture the producer would report
        run: node security/attest.mjs --print --skip-tests

  ecosystem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node ecosystem/validate.mjs
      - run: cd ecosystem && npm test

  dock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: dock/package-lock.json }
      - run: cd dock && npm ci
      - run: cd dock && npm run check && npm test && npm run build
